# NUEVO — pedido expresamente: corre el escáner (scanner-cli) automáticamente varias veces al
# día, GRATIS (GitHub Actions da minutos de sobra para esto en repos públicos, y también en
# privados hasta cierto límite mensual, más que suficiente aquí), y publica el resultado como
# JSON directamente en el propio repositorio — la app lo descarga desde
# raw.githubusercontent.com en vez de escanear cientos de stocks en el móvil.
name: Escaneo de mercados

on:
  schedule:
    # CAMBIADO a petición expresa: cada 2 horas, pero SOLO en el tramo horario donde hay algo
    # de actividad real en EE.UU. — premarket (4:00-9:30 ET), mercado (9:30-16:00 ET) y
    # afterhours (16:00-20:00 ET) — nada de noche cerrada, cuando no cambia nada.
    # Cubre 4:00, 6:00, 8:00, 10:00, 12:00, 14:00, 16:00, 18:00 y 20:00 hora de Nueva York, de
    # lunes a viernes (9 ejecuciones al día, en vez de las 4 de antes).
    #
    # DOS avisos importantes sobre esto:
    # 1) GitHub Actions usa SIEMPRE UTC, y el cron no sabe de cambios de hora — estos horarios
    #    están calculados para horario de VERANO de EE.UU. (EDT, UTC-4, de marzo a noviembre,
    #    la mayor parte del año). En horario de INVIERNO (EST, UTC-5, noviembre-marzo) todo se
    #    adelantará una hora de más (p. ej. el de las 4:00 ET sonará en realidad a las 3:00 ET).
    #    Si quieres que sea exacto todo el año, hay que cambiar estos números dos veces al año.
    # 2) La última ejecución del día (20:00 ET) cae en 00:00 UTC del día SIGUIENTE — por eso
    #    tiene su propia línea de cron aparte, con el día de la semana desplazado un día
    #    (martes a sábado en UTC = lunes a viernes en horario de Nueva York).
    # 3) Cron no sabe de festivos de mercado (Acción de Gracias, Navidad...) — esos días
    #    correrá igual, sin más consecuencia que un escaneo de más sin cambios que reflejar.
    - cron: '0 8,10,12,14,16,18,20,22 * * 1-5'
    - cron: '0 0 * * 2-6'
  # Permite lanzarlo a mano desde la pestaña "Actions" de GitHub, sin esperar al cron.
  workflow_dispatch: {}

jobs:
  escanear:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      # Los 3 mercados en paralelo, cada uno en su propio runner — más rápido que
      # escanearlos uno detrás de otro, y cada uno escribe su propio JSON.
      matrix:
        mercado: [SP500, NASDAQ100, IBEX35, RUSSELL2000]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permiso de ejecución a gradlew
        # NUEVO — pedido expresamente tras el fallo real "Permission denied": al subir el
        # proyecto desde Windows (vía GitHub Desktop), gradlew pierde el bit de ejecución que
        # Linux necesita para lanzarlo con ./gradlew directamente (Windows no gestiona permisos
        # Unix). Este paso se lo da de nuevo en el propio runner, antes de usarlo.
        run: chmod +x gradlew

      - name: Compilar el escáner
        run: ./gradlew :scanner-cli:installDist --no-daemon

      - name: Escanear ${{ matrix.mercado }}
        run: |
          ./scanner-cli/build/install/scanner-cli/bin/scanner-cli \
            ${{ matrix.mercado }} \
            data/scan-${{ matrix.mercado }}.json

      - name: Subir resultado como artefacto (por si el commit de abajo falla)
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.mercado }}
          path: data/scan-${{ matrix.mercado }}.json

      - name: Publicar el JSON en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.fileMode false
          git add data/scan-${{ matrix.mercado }}.json
          git diff --staged --quiet || git commit -m "Escaneo automático: ${{ matrix.mercado }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          # NUEVO — pedido expresamente tras el fallo real "CONFLICT (add/add)": si dos
          # ejecuciones del workflow se solapan en el tiempo (p. ej. la programada y una lanzada
          # a mano casi a la vez), las dos pueden intentar guardar el MISMO archivo con
          # contenido distinto — como el JSON se regenera entero cada vez (no tiene sentido
          # fusionarlo línea a línea), se usa "merge -X ours" en vez de rebase: si hay un
          # conflicto real de contenido en ESTE archivo, gana la versión que este job acaba de
          # calcular, sin quedarse atascado reintentando el mismo choque una y otra vez.
          exito=false
          for intento in 1 2 3 4 5; do
            git checkout -- . 2>/dev/null || true
            git fetch origin ${{ github.ref_name }}
            if git merge -X ours --no-edit -m "Merge tras escaneo de ${{ matrix.mercado }}" origin/${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}; then
              exito=true
              break
            fi
            git merge --abort 2>/dev/null || true
            echo "Intento $intento de publicar falló, reintentando..."
            sleep $((RANDOM % 10 + 5))
          done
          if [ "$exito" = false ]; then
            echo "No se pudo publicar tras 5 intentos — el resultado sigue disponible como artefacto de esta ejecución."
            exit 1
          fi
